<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>MediDash 监测入口</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
      background: #f2f5f2;
      color: #17342f;
    }
    main { max-width: 420px; margin: 0 auto; padding: 28px 18px 48px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #62746f; line-height: 1.55; }
    button.card {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 14px 0;
      padding: 18px 16px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
      box-shadow: 0 12px 38px rgba(26, 56, 48, .08);
    }
    button.card strong { display: block; font-size: 1.05rem; margin-bottom: 6px; }
    .note { font-size: .85rem; }
    #status { min-height: 1.4em; color: #21634f; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>MediDash 监测</h1>
    <p>大陆入口（国内 CDN）。这是 <strong>main 正式监测页</strong>，跟仓库里的 <code>index.html</code> 同步。</p>
    <p id="status"></p>
    <button class="card" type="button" id="openDash">
      <strong>打开监测页</strong>
      当前 main 化验与床旁趋势
    </button>
    <p class="note">若打不开，把本页链接复制到系统浏览器（Chrome / Safari），不要用微信内置浏览直接停在源码页。</p>
  </main>
  <script type="text/javascript">
  //<![CDATA[
  (function () {
    var status = document.getElementById("status");
    function setStatus(text) {
      if (status) status.textContent = text || "";
    }
    function openPage(file) {
      setStatus("正在从国内镜像加载…");
      fetch(file, { cache: "reload" }).then(function (res) {
        if (!res.ok) throw new Error(String(res.status));
        return res.text();
      }).then(function (html) {
        if (!html || html.indexOf("<html") === -1) throw new Error("empty");
        var blob = new Blob([html], { type: "text/html;charset=utf-8" });
        location.assign(URL.createObjectURL(blob));
      }).catch(function () {
        setStatus("加载失败。请用系统浏览器重试，或稍等镜像刷新后再开。");
      });
    }
    document.getElementById("openDash").addEventListener("click", function () { openPage("index.html"); });
    var hash = (location.hash || "").replace("#", "");
    if (!hash || hash === "open" || hash === "dash") openPage("index.html");
  })();
  //]]>
  </script>
</body>
</html>
